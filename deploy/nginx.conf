# ============================================================
# /etc/nginx/sites-available/emenu-cambodia.com
#
# Copy to server:
#   sudo cp nginx.conf /etc/nginx/sites-available/emenu-cambodia.com
#   sudo ln -sf /etc/nginx/sites-available/emenu-cambodia.com \
#               /etc/nginx/sites-enabled/emenu-cambodia.com
#   sudo nginx -t && sudo systemctl reload nginx
# ============================================================

# ── Rate limiting zones ──────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

# ── HTTP → HTTPS redirect (all domains) ─────────────────────
server {
    listen 80;
    server_name emenu-cambodia.com www.emenu-cambodia.com *.emenu-cambodia.com;
    return 301 https://$host$request_uri;
}

# ── Main domain: owner landing / dashboard ──────────────────
server {
    listen 443 ssl;
    server_name emenu-cambodia.com www.emenu-cambodia.com;

    ssl_certificate     /etc/letsencrypt/live/emenu-cambodia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/emenu-cambodia.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Owner frontend (Next.js — port 3001)
    location / {
        proxy_pass         http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Backend API (Spring Boot — port 7070)
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass         http://localhost:7070;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # WebSocket (dashboard live updates)
    location /ws/ {
        proxy_pass         http://localhost:7070;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 3600s;
    }
}

# ── Wildcard subdomains: customer menu app ───────────────────
server {
    listen 443 ssl;
    server_name *.emenu-cambodia.com;

    # Wildcard cert covers *.emenu-cambodia.com
    ssl_certificate     /etc/letsencrypt/live/emenu-cambodia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/emenu-cambodia.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Customer frontend (Next.js — port 3000)
    location / {
        proxy_pass         http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Backend API also reachable from subdomain pages
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass         http://localhost:7070;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass         http://localhost:7070;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_read_timeout 3600s;
    }
}
