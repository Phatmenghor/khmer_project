upstream emenu_client_frontend {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# HTTP → HTTPS redirect for all subdomains
server {
    listen 80;
    listen [::]:80;
    server_name ~^(?<subdomain>.+)\.emenu-cambodia\.com$;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # Wildcard — matches any *.emenu-cambodia.com
    server_name ~^(?<subdomain>.+)\.emenu-cambodia\.com$;

    # Wildcard cert (covers *.emenu-cambodia.com)
    ssl_certificate     /etc/letsencrypt/live/emenu-cambodia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/emenu-cambodia.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 50M;
    server_tokens off;

    add_header X-Frame-Options      DENY    always;
    add_header X-Content-Type-Options nosniff always;

    proxy_http_version 1.1;
    proxy_connect_timeout 90s;
    proxy_send_timeout    90s;
    proxy_read_timeout    90s;

    # Pass subdomain to Next.js so SubdomainProvider can read hostname
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location ~* \.(ico|png|jpg|jpeg|gif|svg|woff|woff2|ttf|eot|css|js|map)$ {
        proxy_pass http://emenu_client_frontend;
        expires 1h;
        add_header Cache-Control "public";
    }

    location /_next/ {
        proxy_pass http://emenu_client_frontend;
        expires 5m;
        add_header Cache-Control "public";
    }

    location /health {
        access_log off;
        return 200 "emenu Client OK\n";
        add_header Content-Type text/plain;
    }

    location / {
        proxy_pass http://emenu_client_frontend;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
