spring:
  profiles:
    active: "${SPRING_PROFILES_ACTIVE:local}"
  application:
    name: resource-storage-service

  datasource:
    hikari:
      initialization-fail-timeout: -1

  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          fetch_size: 50
          time_zone: Asia/Phnom_Penh
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 25
        boot:
          allow_jdbc_metadata_access: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB

server:
  port: "${SERVER_PORT:7072}"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

spaces:
  endpoint: "${SPACES_ENDPOINT:https://sgp1.digitaloceanspaces.com}"
  region: "${SPACES_REGION:sgp1}"
  bucket: "${SPACES_BUCKET:emenu-cambodia}"
  access-key: "${SPACES_ACCESS_KEY:DO00QQ6TAV62YPV3DC4U}"
  secret-key: "${SPACES_SECRET_KEY:+ye4MKS7msULnLoNvmEy60KpBGaG8IWGepnTNrdTfTw}"
  cdn-base-url: "${SPACES_CDN_BASE_URL:https://emenu-cambodia.sgp1.cdn.digitaloceanspaces.com}"
  store-on-database: "${STORE_ON_DATABASE:true}"
  local-base-url: "http://localhost:${server.port}"
  admin-username: "${ADMIN_USERNAME:phatmenghor}"
  admin-password: "${ADMIN_PASSWORD:Hour1819}"
  # API keys are now stored in the database (api_keys table).
  # Use POST /api/v1/admin/keys to create keys — no YAML config needed.

logging:
  level:
    org.hibernate.orm.deprecation: ERROR
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level %-35.35logger{35} [%X{traceId:--}] %msg%n"
