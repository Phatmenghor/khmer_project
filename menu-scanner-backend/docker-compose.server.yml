version: "3.9"

# Run on server where postgres + redis are already running.
# No .env file needed — all defaults are in application-prod.yaml.
# Only override secrets that should not be in source code.

services:
  backend:
    container_name: emenu_backend
    image: eclipse-temurin:21-jre-alpine
    restart: unless-stopped
    working_dir: /app
    volumes:
      - /opt/apps/emenu-backend/e_menu_cambodia.jar:/app/e_menu_cambodia.jar
      - /opt/apps/emenu-backend/logs:/app/logs
    entrypoint:
      - sh
      - -c
      - "java -XX:+UseZGC -XX:+ZGenerational -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -jar /app/e_menu_cambodia.jar"
    ports:
      - "7070:7070"
    environment:
      SPRING_PROFILES_ACTIVE: prod
    extra_hosts:
      - "host.docker.internal:host-gateway"
