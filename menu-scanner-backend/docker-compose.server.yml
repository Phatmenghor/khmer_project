version: "3.9"

# Run on server where postgres + redis are already running.
# No .env file needed — all defaults are in application-prod.yaml.
# Only override secrets that should not be in source code.

services:
  backend:
    container_name: emenu_backend
    build:
      context: .
      dockerfile: Dockerfile.server
    image: emenu-cambodia/backend:1.0.0
    restart: unless-stopped
    working_dir: /app
    volumes:
      - /opt/apps/emenu-backend/e_menu_cambodia.jar:/app/e_menu_cambodia.jar
      - /opt/apps/emenu-backend/logs:/app/logs
    ports:
      - "7070:7070"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: "emenu-cambodia-production-secret-change-this-minimum-64-chars-xxxxxxxxxx"
      APP_ADMIN_EMAIL: "phatmenghor19@gmail.com"
      APP_ADMIN_PASSWORD: "88889999"
    extra_hosts:
      - "host.docker.internal:host-gateway"
