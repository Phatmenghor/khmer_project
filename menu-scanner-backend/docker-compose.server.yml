services:
  backend:
    container_name: emenu_backend
    build:
      context: /opt/apps/emenu-backend
      dockerfile: Dockerfile
    image: emenu-cambodia/backend:1.0.0
    restart: unless-stopped
    volumes:
      - /opt/apps/emenu-backend/logs:/app/logs
    ports:
      - "7070:7070"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TELEGRAM_WEBHOOK_URL: "https://api.emenu-cambodia.com"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # No memory limit — JVM reads full host RAM via UseContainerSupport
    # MaxRAMPercentage=90 uses 90% of total host RAM
    deploy:
      resources:
        limits:
          cpus: "0"       # 0 = no limit, use all CPUs
          memory: "0"     # 0 = no limit, use all RAM
