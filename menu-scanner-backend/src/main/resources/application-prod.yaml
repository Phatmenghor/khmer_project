# ============================================================
# application-prod.yaml — PRODUCTION
# ============================================================
# ALL values MUST be set via environment variables.
# No defaults — app refuses to start if required vars are missing.
# ============================================================
spring:
  datasource:
    url: "jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}"
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: HikariPool-Prod
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: false
    validate-on-migrate: true

  data:
    redis:
      host: "${REDIS_HOST}"
      port: "${REDIS_PORT:6379}"
      password: "${REDIS_PASSWORD}"
      database: "${REDIS_DATABASE:0}"

jwt:
  secret: "${JWT_SECRET}"

app:
  cache:
    provider: "${CACHE_PROVIDER:redis}"
  security:
    cors:
      allowed-origins: "${CORS_ALLOWED_ORIGINS}"
  init:
    create-admin: true
    admin-email: "${APP_ADMIN_EMAIL}"
    admin-password: "${APP_ADMIN_PASSWORD}"

telegram:
  bot:
    token: "${TELEGRAM_BOT_TOKEN}"
    enabled: true
    group-chat-id: "${TELEGRAM_GROUP_CHAT_ID}"

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

management:
  endpoint:
    health:
      show-details: never
      show-components: never
