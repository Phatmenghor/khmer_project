# ============================================================
# application-prod.yaml — PRODUCTION
# ============================================================
# ALL sensitive values MUST be provided via environment variables.
# No defaults for secrets — missing vars will cause startup failure.
# ============================================================
spring:
  datasource:
    url: "jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}"
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: HikariPool-Prod
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: false
    validate-on-migrate: true

# Redis — required in prod
  data:
    redis:
      host: "${REDIS_HOST}"
      port: "${REDIS_PORT:6379}"
      password: "${REDIS_PASSWORD}"
      database: "${REDIS_DATABASE:0}"

app:
  cache:
    provider: "${CACHE_PROVIDER:redis}"
  security:
    cors:
      allowed-origins: "${CORS_ALLOWED_ORIGINS}"

# Swagger disabled in production
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

# Actuator — hide internals in production
management:
  endpoint:
    health:
      show-details: never
      show-components: never

# Telegram
telegram:
  bot:
    token: "${TELEGRAM_BOT_TOKEN}"
    enabled: true
    group-chat-id: "${TELEGRAM_GROUP_CHAT_ID}"
