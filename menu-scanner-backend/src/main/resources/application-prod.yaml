# ============================================================
# application-prod.yaml — PRODUCTION
# ============================================================
spring:
  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:e_menu_platform}"
    username: "${DB_USERNAME:postgres}"
    password: "${DB_PASSWORD:postgres}"
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: HikariPool-Prod
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: false
    validate-on-migrate: true

  data:
    redis:
      host: "${REDIS_HOST:localhost}"
      port: "${REDIS_PORT:6379}"
      password: "${REDIS_PASSWORD:}"
      database: "${REDIS_DATABASE:0}"

jwt:
  secret: "${JWT_SECRET:prod-secret-must-be-changed-replace-with-minimum-64-char-random-string-xyz}"
  expiration: "${JWT_EXPIRATION:86400000}"
  refresh-token-expiration: "${JWT_REFRESH_EXPIRATION:604800000}"

telegram:
  bot:
    token: "${TELEGRAM_BOT_TOKEN:disabled}"
    enabled: true
    group-chat-id: "${TELEGRAM_GROUP_CHAT_ID:0}"
    webhook-url: "${TELEGRAM_WEBHOOK_URL:}"
    auto-setup: true

app:
  cache:
    provider: "${CACHE_PROVIDER:redis}"
  security:
    cors:
      allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4173}"
  init:
    create-admin: true
    admin-email: "${APP_ADMIN_EMAIL:admin@emenu.local}"
    admin-password: "${APP_ADMIN_PASSWORD:Admin@123456}"

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

management:
  endpoint:
    health:
      show-details: never
      show-components: never
