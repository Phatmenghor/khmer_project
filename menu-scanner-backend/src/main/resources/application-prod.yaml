# ============================================================
# application-prod.yaml — unified profile (local/dev/h2/prod identical)
# All dynamic config (tokens, auth, telegram, admin, CORS, social) lives
# here so it's easy to change per environment.
# ============================================================
spring:
  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:account_testing}"
    username: "${DB_USERNAME:postgres}"
    password: "${DB_PASSWORD:postgres}"
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: HikariPool

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# ── Server ────────────────────────────────────────────────────────────────────
server:
  port: "${SERVER_PORT:7070}"
  max-http-request-header-size: 65536
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 2048

# ── JWT / Auth ────────────────────────────────────────────────────────────────
jwt:
  secret: "${JWT_SECRET:default-dev-secret-please-change-in-production-min-64-chars-xxxxxxxxxx}"
  expiration: "${JWT_EXPIRATION:86400000}"
  refresh-token-expiration: "${JWT_REFRESH_EXPIRATION:604800000}"

# ── Telegram ──────────────────────────────────────────────────────────────────
telegram:
  bot:
    token: "${TELEGRAM_BOT_TOKEN:8464259107:AAHdIC3EZb_3uID4vnhteY6PYtmO9WGDBjU}"
    enabled: true
    group-chat-id: "${TELEGRAM_GROUP_CHAT_ID:-1002784141362}"
    webhook-url: "${TELEGRAM_WEBHOOK_URL:}"
    auto-setup: true

# ── App dynamic config ────────────────────────────────────────────────────────
app:
  init:
    create-admin: true
    admin-email: "${APP_ADMIN_EMAIL:phatmenghor19@gmail.com}"
    admin-password: "${APP_ADMIN_PASSWORD:88889999}"
  cache:
    provider: "${CACHE_PROVIDER:caffeine}"
  security:
    cors:
      allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4173}"
    token-cleanup:
      enabled: true
  social:
    telegram:
      bot-token: "${TELEGRAM_BOT_TOKEN:8464259107:AAHdIC3EZb_3uID4vnhteY6PYtmO9WGDBjU}"
      group-chat-id: "${TELEGRAM_GROUP_CHAT_ID:-1002784141362}"
      enabled: true
    google:
      client-id: "${GOOGLE_CLIENT_ID:disabled}"
      client-secret: "${GOOGLE_CLIENT_SECRET:disabled}"
      enabled: false
    facebook:
      app-id: "${FACEBOOK_APP_ID:disabled}"
      app-secret: "${FACEBOOK_APP_SECRET:disabled}"
      enabled: false

logging:
  level:
    root: INFO
    com.emenu: DEBUG
    org.springframework: WARN
    org.hibernate: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId}] %logger{30} - %msg%n"
