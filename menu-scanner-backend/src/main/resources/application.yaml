# ============================================================
# application.yaml - BASE CONFIG (shared across all profiles)
# ============================================================
# To switch environment:
#   profiles.active: local => localhost DB, debug logging
#   profiles.active: dev => dev server DB
#   profiles.active: prod => production DB, minimal logging
# ============================================================
spring:
  application:
    name: cambodia-emenu-platform
  # IMPORTANT: Set SPRING_PROFILES_ACTIVE env var to 'local', 'dev', or 'prod' before starting.
  # Do NOT rely on this base config's default. Production MUST use 'prod'.

  # JPA - common settings (ddl-auto overridden per profile)
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          fetch_size: 50
          time_zone: Asia/Phnom_Penh
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 25

  # Cache — set type=none; CacheConfig/RedisConfig manage the beans directly
  cache:
    type: none

  # Redis (only used when app.cache.provider=redis)
  data:
    redis:
      host: "${REDIS_HOST:localhost}"
      port: "${REDIS_PORT:6379}"
      password: "${REDIS_PASSWORD:}"
      database: "${REDIS_DATABASE:0}"
      timeout: 2000ms

# Server
server:
  port: 7070
  max-http-request-header-size: 65536
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 2048

# JWT — JWT_SECRET MUST be set via environment variable in production (min 64 chars)
jwt:
  secret: "${JWT_SECRET}"
  expiration: "${JWT_EXPIRATION:86400000}"           # 24 hours (ms)
  refresh-token-expiration: "${JWT_REFRESH_EXPIRATION:604800000}" # 7 days (ms)

# Actuator & Monitoring
management:
  endpoints:
    web:
      exposure:
        # 'env' removed — it can expose secrets from environment variables
        include: health,info,metrics,prometheus,caches,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    version: "1.0.0"
    description: "Restaurant Management Platform for Cambodia"

# Swagger / OpenAPI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs
    enabled: true

# Telegram — token MUST be provided via TELEGRAM_BOT_TOKEN environment variable
telegram:
  bot:
    token: "${TELEGRAM_BOT_TOKEN:}"
    enabled: true
    group-chat-id: "${TELEGRAM_GROUP_CHAT_ID:}"
    webhook-url: "${TELEGRAM_WEBHOOK_URL:}"
    auto-setup: true

# Application
app:
  name: "Cambodia E-Menu Platform"
  version: "1.0.0"
  description: "Restaurant Management Platform for Cambodia"
  init:
    create-admin: true
    # SECURITY: Set admin credentials via environment variables — never hardcode here
    admin-email: "${APP_ADMIN_EMAIL:}"
    admin-password: "${APP_ADMIN_PASSWORD:}"
    # Test data now generated via SQL script: test-data-with-freepik-urls.sql
  subscription:
    expiry-soon-days: 7   # days before end date to flag as expiring-soon
    # Run directly in pgAdmin for instant data population with Freepik images
  cache:
    # "caffeine" (default, in-process) or "redis" (distributed, requires Redis)
    provider: "${CACHE_PROVIDER:caffeine}"
  security:
    cors:
      allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}"
    token-cleanup:
      enabled: true
  social:
    telegram:
      bot-token: "${TELEGRAM_BOT_TOKEN:}"
      enabled: true
    google:
      client-id: "${GOOGLE_CLIENT_ID:}"
      client-secret: "${GOOGLE_CLIENT_SECRET:}"
      enabled: true
    facebook:
      app-id: "${FACEBOOK_APP_ID:}"
      app-secret: "${FACEBOOK_APP_SECRET:}"
      enabled: false
