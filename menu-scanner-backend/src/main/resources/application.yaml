# ============================================================
# application.yaml — BASE CONFIG (shared across all profiles)
# ============================================================
# Profile selection:
#   local  → localhost PostgreSQL, debug logging
#   dev    → dev-server PostgreSQL, standard logging
#   prod   → production DB, no Swagger, minimal logging
# ============================================================
spring:
  application:
    name: cambodia-emenu-platform

  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          fetch_size: 50
          time_zone: Asia/Phnom_Penh
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 25

  flyway:
    enabled: false

  cache:
    type: none

  data:
    redis:
      host: "${REDIS_HOST:localhost}"
      port: "${REDIS_PORT:6379}"
      password: "${REDIS_PASSWORD:}"
      database: "${REDIS_DATABASE:0}"
      timeout: 2000ms

# ── Server ────────────────────────────────────────────────────────────────────
server:
  port: 7070
  max-http-request-header-size: 65536
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 2048

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt:
  secret: "${JWT_SECRET:default-dev-secret-please-change-in-production-min-64-chars-xxxxxxxxxx}"
  expiration: "${JWT_EXPIRATION:86400000}"
  refresh-token-expiration: "${JWT_REFRESH_EXPIRATION:604800000}"

# ── Actuator & Monitoring ─────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,caches,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    version: "1.0.0"
    description: "Restaurant Management Platform for Cambodia"

# ── Swagger / OpenAPI ─────────────────────────────────────────────────────────
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs
    enabled: true

# ── Telegram ──────────────────────────────────────────────────────────────────
telegram:
  bot:
    token: "${TELEGRAM_BOT_TOKEN:8464259107:AAHdIC3EZb_3uID4vnhteY6PYtmO9WGDBjU}"
    enabled: true
    group-chat-id: "${TELEGRAM_GROUP_CHAT_ID:-1002784141362}"
    webhook-url: "${TELEGRAM_WEBHOOK_URL:}"
    auto-setup: true

# ── Application ───────────────────────────────────────────────────────────────
app:
  name: "Cambodia E-Menu Platform"
  version: "1.0.0"
  description: "Restaurant Management Platform for Cambodia"
  init:
    create-admin: true
    admin-email: "${APP_ADMIN_EMAIL:phatmenghor19@gmail.com}"
    admin-password: "${APP_ADMIN_PASSWORD:88889999}"
  subscription:
    expiry-soon-days: 7
  cache:
    provider: "${CACHE_PROVIDER:caffeine}"
  security:
    cors:
      allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4173}"
    token-cleanup:
      enabled: true
  social:
    telegram:
      bot-token: "${TELEGRAM_BOT_TOKEN:8464259107:AAHdIC3EZb_3uID4vnhteY6PYtmO9WGDBjU}"
      group-chat-id: "${TELEGRAM_GROUP_CHAT_ID:-1002784141362}"
      enabled: true
    google:
      client-id: "${GOOGLE_CLIENT_ID:disabled}"
      client-secret: "${GOOGLE_CLIENT_SECRET:disabled}"
      enabled: false
    facebook:
      app-id: "${FACEBOOK_APP_ID:disabled}"
      app-secret: "${FACEBOOK_APP_SECRET:disabled}"
      enabled: false
