# ============================================================
# application.yaml — BASE CONFIG (framework-level only)
# ============================================================
# Dynamic / per-environment config (JWT, telegram, admin, CORS, social,
# cache provider) lives in each profile yaml so it can be changed easily
# per environment (local/dev/h2/prod).
# ============================================================
spring:
  profiles:
    active: "${SPRING_PROFILES_ACTIVE:prod}"
  application:
    name: cambodia-emenu-platform

  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          fetch_size: 50
          time_zone: Asia/Phnom_Penh
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 25

  flyway:
    enabled: false

  servlet:
    multipart:
      # Per-file cap: 5MB matches the frontend.
      # Total request cap: 25MB so a multi-file upload (up to ~5 files of 5MB)
      # still fits. The per-file limit is what the friendly error reports.
      max-file-size: 5MB
      max-request-size: 25MB

  cache:
    type: none

  data:
    redis:
      host: "${REDIS_HOST:167.172.88.194}"
      port: "${REDIS_PORT:6379}"
      password: "${REDIS_PASSWORD:}"
      database: "${REDIS_DATABASE:0}"
      timeout: 2000

# ── Actuator & Monitoring ─────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,caches,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    version: "1.0.0"
    description: "Restaurant Management Platform for Cambodia"

# ── Swagger / OpenAPI ─────────────────────────────────────────────────────────
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs
    enabled: true

# ── Application (static metadata only) ────────────────────────────────────
# Each key is registered in the Spaces service api_keys table with its own
# projectCode + path. No businessId or X-Project-Code header is needed.
spaces:
  service-url: "${SPACES_SERVICE_URL:http://localhost:7072}"
  api-key: "${SPACES_API_KEY:sk_emenutest_Cfk8IIisHl6bPfW7Cqd5DsQTo2i2Fx2j}"

app:
  name: "Cambodia E-Menu Platform"
  version: "1.0.0"
  description: "Restaurant Management Platform for Cambodia"
  subscription:
    expiry-soon-days: 7
