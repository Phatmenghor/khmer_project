# ============================================================
# application.yaml - BASE CONFIG (shared across all profiles)
# ============================================================
# To switch environment:
#   profiles.active: local => localhost DB, debug logging
#   profiles.active: dev => dev server DB
#   profiles.active: prod => production DB, minimal logging
# ============================================================
spring:
  application:
    name: cambodia-emenu-platform
  profiles:
    active: local # change to "local" or "dev" as needed

  # JPA - common settings (ddl-auto overridden per profile)
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: Asia/Phnom_Penh

  # Cache — named caches managed by CacheConfig bean
  cache:
    type: caffeine

# Server
server:
  port: 7070
  max-http-request-header-size: 65536
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 2048

# JWT
jwt:
  secret: "${JWT_SECRET:da2bd42bef8f9f957d647ed13571d35b59c7055fb723eacdb05154878da17d77d3180385fc232cab38bded0fc7dbda0d439cc275e91164ade266d64d50633bc7}"
  expiration: "${JWT_EXPIRATION:86400000}"           # 24 hours (ms)
  refresh-token-expiration: "${JWT_REFRESH_EXPIRATION:604800000}" # 7 days (ms)

# Actuator & Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,caches,loggers,env
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    version: "1.0.0"
    description: "Restaurant Management Platform for Cambodia"

# Swagger / OpenAPI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs
    enabled: true

# Telegram
telegram:
  bot:
    token: "${TELEGRAM_BOT_TOKEN:8464259107:AAHdIC3EZb_3uID4vnhteY6PYtmO9WGDBjU}"
    enabled: true
    group-chat-id: "${TELEGRAM_GROUP_CHAT_ID:-1002784141362}"
    webhook-url: "${TELEGRAM_WEBHOOK_URL:}"
    auto-setup: true

# Application
app:
  name: "Cambodia E-Menu Platform"
  version: "1.0.0"
  description: "Restaurant Management Platform for Cambodia"
  init:
    create-admin: true
    admin-email: "phatmenghor19@gmail.com"
    admin-password: "88889999"
    # Test data now generated via SQL script: test-data-with-freepik-urls.sql
  subscription:
    expiry-soon-days: 7   # days before end date to flag as expiring-soon
    # Run directly in pgAdmin for instant data population with Freepik images
  security:
    token-cleanup:
      enabled: true
  social:
    telegram:
      bot-token: "${TELEGRAM_BOT_TOKEN:8464259107:AAHdIC3EZb_3uID4vnhteY6PYtmO9WGDBjU}"
      enabled: true
    google:
      client-id: "${GOOGLE_CLIENT_ID:}"
      client-secret: "${GOOGLE_CLIENT_SECRET:}"
      enabled: true
    facebook:
      app-id: "${FACEBOOK_APP_ID:}"
      app-secret: "${FACEBOOK_APP_SECRET:}"
      enabled: false
