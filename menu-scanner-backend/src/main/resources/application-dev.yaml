# ============================================================
# application-dev.yaml — DEVELOPMENT SERVER
# ============================================================
spring:
  datasource:
    url: "jdbc:postgresql://${DB_HOST:host.docker.internal}:${DB_PORT:5432}/${DB_NAME:e_menu_platform}"
    username: "${DB_USERNAME:postgres}"
    password: "${DB_PASSWORD:postgres}"
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 3
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: HikariPool-Dev

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: false

jwt:
  secret: "${JWT_SECRET:dev-server-secret-replace-in-production-with-minimum-64-char-random-string-xyz}"

app:
  cache:
    provider: "${CACHE_PROVIDER:caffeine}"
  security:
    cors:
      allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4173}"
  init:
    create-admin: true
    admin-email: "${APP_ADMIN_EMAIL:admin@emenu.local}"
    admin-password: "${APP_ADMIN_PASSWORD:Admin@123456}"

telegram:
  bot:
    token: "${TELEGRAM_BOT_TOKEN:disabled}"
    enabled: false
    group-chat-id: "${TELEGRAM_GROUP_CHAT_ID:0}"

logging:
  level:
    root: INFO
    com.emenu: INFO
    org.springframework: WARN
    org.hibernate: WARN
