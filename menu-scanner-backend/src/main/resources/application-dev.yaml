# ============================================================
# application-dev.yaml — DEVELOPMENT SERVER
# ============================================================
# All values have defaults so the app starts without any env vars.
# Override via environment variables for the shared dev server.
# ============================================================
spring:
  datasource:
    url: "jdbc:postgresql://${DB_HOST:host.docker.internal}:${DB_PORT:5432}/${DB_NAME:e_menu_platform}"
    username: "${DB_USERNAME:postgres}"
    password: "${DB_PASSWORD:}"
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 3
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: HikariPool-Dev

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: false

# Dev JWT secret — DEV ONLY. Generate for prod: openssl rand -hex 64
jwt:
  secret: "${JWT_SECRET:dev-server-secret-replace-in-production-with-minimum-64-char-random-string-xyz}"

app:
  cache:
    provider: "${CACHE_PROVIDER:caffeine}"
  security:
    cors:
      allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4173}"

logging:
  level:
    root: INFO
    com.emenu: INFO
    org.springframework: WARN
    org.hibernate: WARN
