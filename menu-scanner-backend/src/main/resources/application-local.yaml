# ============================================================
# application-local.yaml — LOCAL DEVELOPMENT
# ============================================================
# All values have defaults so the app starts without any env vars.
# Override via environment variables or .env file as needed.
# ============================================================
spring:
  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:e_menu_platform}"
    username: "${DB_USERNAME:postgres}"
    password: "${DB_PASSWORD:}"
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: HikariPool-Local

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: false

# Local JWT secret — DEV ONLY. Generate for prod: openssl rand -hex 64
jwt:
  secret: "${JWT_SECRET:local-dev-secret-replace-in-production-with-minimum-64-char-random-string-xyz}"

app:
  cache:
    provider: "${CACHE_PROVIDER:caffeine}"
  security:
    cors:
      allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4173}"

logging:
  level:
    root: INFO
    com.emenu: DEBUG
    org.springframework: WARN
    org.hibernate: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId}] %logger{30} - %msg%n"
