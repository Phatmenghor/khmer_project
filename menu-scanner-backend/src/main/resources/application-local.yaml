# ============================================================
# application-local.yaml  –  LOCAL DEVELOPMENT
# ============================================================
# Uses localhost PostgreSQL.
# Override any value with environment variables:
#   DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD
# ============================================================
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:e_menu_platform}
    username: ${DB_USERNAME:postgres}
    # SECURITY: Set DB_PASSWORD env var; never commit real passwords here
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: HikariPool-Local

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# Local-only JWT secret (DEV ONLY — generate a fresh one for prod via openssl rand -hex 64)
jwt:
  secret: "${JWT_SECRET:local-dev-secret-replace-in-production-with-min-64-char-random-string-x9z}"

logging:
  level:
    root: INFO
    com.emenu: INFO
    org.springframework: WARN
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Telegram (Local Development) — set TELEGRAM_BOT_TOKEN in .env or env vars
telegram:
  bot:
    token: "${TELEGRAM_BOT_TOKEN:}"
    enabled: true
    group-chat-id: "${TELEGRAM_GROUP_CHAT_ID:}"
