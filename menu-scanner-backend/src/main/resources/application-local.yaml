# ============================================================
# application-local.yaml — unified profile (local/dev/h2/prod identical)
# All dynamic config (tokens, auth, telegram, admin, CORS, social) lives
# here so it's easy to change per environment.
# ============================================================
spring:
  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:e_menu_platform}"
    username: "${DB_USERNAME:postgres}"
    password: "${DB_PASSWORD:Hour1819}"
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: HikariPool

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# ── Server ────────────────────────────────────────────────────────────────────
server:
  port: "${SERVER_PORT:7070}"
  max-http-request-header-size: 65536
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 2048

# ── JWT / Auth ────────────────────────────────────────────────────────────────
jwt:
  secret: "${JWT_SECRET:default-dev-secret-please-change-in-production-min-64-chars-xxxxxxxxxx}"
  expiration: "${JWT_EXPIRATION:86400000}"
  refresh-token-expiration: "${JWT_REFRESH_EXPIRATION:604800000}"

# ── Telegram ──────────────────────────────────────────────────────────────────
telegram:
  bot:
    token: "${TELEGRAM_BOT_TOKEN:8464259107:AAHdIC3EZb_3uID4vnhteY6PYtmO9WGDBjU}"
    enabled: true
    group-chat-id: "${TELEGRAM_GROUP_CHAT_ID:-1002784141362}"
    webhook-url: "${TELEGRAM_WEBHOOK_URL:}"
    auto-setup: true

# ── App dynamic config ────────────────────────────────────────────────────────
app:
  rate-limit:
    enabled: false
  init:
    create-admin: true
    admin-email: "${APP_ADMIN_EMAIL:phatmenghor19@gmail.com}"
    admin-password: "${APP_ADMIN_PASSWORD:88889999}"
  cache:
    provider: "${CACHE_PROVIDER:caffeine}"
  security:
    token-cleanup:
      enabled: true
  social:
    telegram:
      bot-token: "${TELEGRAM_BOT_TOKEN:8464259107:AAHdIC3EZb_3uID4vnhteY6PYtmO9WGDBjU}"
      group-chat-id: "${TELEGRAM_GROUP_CHAT_ID:-1002784141362}"
      enabled: true
    google:
      client-id: "${GOOGLE_CLIENT_ID:disabled}"
      client-secret: "${GOOGLE_CLIENT_SECRET:disabled}"
      enabled: false
    facebook:
      app-id: "${FACEBOOK_APP_ID:disabled}"
      app-secret: "${FACEBOOK_APP_SECRET:disabled}"
      enabled: false

# ── Remote Spaces Microservice ────────────────────────────────────────────────
# Each key is registered in the Spaces service api_keys table with its own
# projectCode + path. No businessId or X-Project-Code header is needed.
spaces:
  service-url: "${SPACES_SERVICE_URL:http://localhost:7072}"
  api-key: "${SPACES_API_KEY:sk_emenutest_Cfk8IIisHl6bPfW7Cqd5DsQTo2i2Fx2j}"

logging:
  level:
    root: INFO
    org.springframework: WARN
    org.hibernate: WARN
    org.apache.catalina: WARN
    org.apache.tomcat: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level %-35.35logger{35} [%X{traceId:--}] %msg%n"
