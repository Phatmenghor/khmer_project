# ============================================================
# application-test.yaml — INTEGRATION TESTS
# ============================================================
spring:
  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:emenu_test}"
    username: "${DB_USERNAME:test}"
    password: "${DB_PASSWORD:test}"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: false

  cache:
    type: none

  data:
    redis:
      host: "${REDIS_HOST:localhost}"
      port: "${REDIS_PORT:6379}"
      password: "${REDIS_PASSWORD:}"
      database: 0

jwt:
  secret: "${JWT_SECRET:test-only-secret-do-not-use-in-production-minimum-64-characters-long-xxxxx}"
  expiration: 3600000
  refresh-token-expiration: 86400000

app:
  cache:
    provider: caffeine
  security:
    cors:
      allowed-origins: "http://localhost:3000"
    token-cleanup:
      enabled: false
  init:
    create-admin: false
    admin-email: "admin@test.local"
    admin-password: "Admin@123456"

telegram:
  bot:
    token: "disabled"
    enabled: false
    group-chat-id: "0"

logging:
  level:
    root: WARN
    com.emenu: INFO
    org.hibernate.SQL: WARN
