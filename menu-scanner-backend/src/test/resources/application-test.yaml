# ============================================================
# application-test.yaml — INTEGRATION TESTS
# ============================================================
spring:
  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:emenu_test}"
    username: "${DB_USERNAME:test}"
    password: "${DB_PASSWORD:test}"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: false

  cache:
    type: none

jwt:
  secret: "${JWT_SECRET:test-only-secret-do-not-use-in-production-minimum-64-characters-long-xxxxx}"
  expiration: "${JWT_EXPIRATION:86400000}"
  refresh-token-expiration: "${JWT_REFRESH_EXPIRATION:604800000}"

telegram:
  bot:
    token: "${TELEGRAM_BOT_TOKEN:disabled}"
    enabled: true
    group-chat-id: "${TELEGRAM_GROUP_CHAT_ID:0}"
    webhook-url: "${TELEGRAM_WEBHOOK_URL:}"
    auto-setup: true

app:
  security:
    cors:
      allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:3000}"
    token-cleanup:
      enabled: false
  init:
    create-admin: false
    admin-email: "${APP_ADMIN_EMAIL:admin@test.local}"
    admin-password: "${APP_ADMIN_PASSWORD:Admin@123456}"

logging:
  level:
    root: WARN
    com.emenu: INFO
    org.hibernate.SQL: WARN
