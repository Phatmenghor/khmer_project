# ============================================================
# application.yaml — BASE CONFIG (Bakong Payment Service)
# ============================================================
spring:
  profiles:
    active: "${SPRING_PROFILES_ACTIVE:local}"
  application:
    name: payway-payment-service

  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          fetch_size: 50
          time_zone: Asia/Phnom_Penh
        order_inserts: true
        order_updates: true

# ── Security Configuration ───────────────────────────────────────────────────
security:
  basic:
    username: "${SECURITY_BASIC_USERNAME:admin}"
    password: "${SECURITY_BASIC_PASSWORD:admin123}"

# ── Base Bakong Configuration ────────────────────────────────────────────────
bakong:
  api-url: "${BAKONG_API_URL:https://api-bakong.nbc.gov.kh}"
  account-id: "${BAKONG_ACCOUNT_ID:phatmenghor@bkrt}"
  email: "${BAKONG_EMAIL:phatmenghor19@gmail.com}"
  enabled: true

# ── ABA PayWay Configuration ────────────────────────────────────────────────
payway:
  merchant-id: "${PAYWAY_MERCHANT_ID:ec477511}"
  api-key: "${PAYWAY_API_KEY:d2b3cc6044e4785508e4e78d4dfdc85b3d58a656}"
  api-url: "${PAYWAY_API_URL:https://checkout-sandbox.payway.com.kh}"
  purchase-url: "${PAYWAY_PURCHASE_URL:https://checkout-sandbox.payway.com.kh/api/payment-gateway/v1/payments/purchase}"
  check-transaction-url: "${PAYWAY_CHECK_TRANSACTION_URL:https://checkout-sandbox.payway.com.kh/api/payment-gateway/v1/payments/check-transaction}"
  rsa-public-key: "${PAYWAY_RSA_PUBLIC_KEY:-----BEGIN PUBLIC KEY-----\nMIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQCm0RzZxzff66mr9eVA7KT44+PvnBYau1ym+BJ/DvEmDxiqoPcMna20BrqkGo3/BYjCG6E1q9ZATj8Ru5+jhqbVE65jMKeVnjW8d4VhkH74FQs77dIaUiMJiWnxJ0Rpe1mLgHY/bYpenVsSnFqkZPzWCu+63RdgzzHsMhmVFGMaZQIDAQAB\n-----END PUBLIC KEY-----}"
